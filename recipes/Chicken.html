<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香菇雞湯</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <strong><h1>香菇雞湯的食譜</h1></strong>
        <h2>準備食材</h2>
        <ul>
            <li>土雞肉 x1盒</li>
            <li>香菇 x1包</li>
            <li>大蒜適量</li>
            <li>沙拉油</li>
            <li>米酒少許</li>

        </ul>
        <h2>步驟</h2>
        <ol id="main">
            <li >把香菇泡水，讓香菇軟一點(要完全泡到蓋過去)大約泡10分鐘即可 使用飲用水，泡完水先不用倒掉，後續還須使用。</li>
            <li class="content">在等香菇泡水時，等鍋子預熱，倒入少許沙拉油，把土雞肉先乾煎至表面金黃後起鍋放旁邊等待。</li>
            <li class="content">將泡水的香菇整碗倒進鍋子，以及煎好的土雞肉，並加入大約300cc的水，再加入大蒜以及米酒</li>
            <li class="content">中火慢煮大約30分鐘，把鍋裡浮起的雜質撈起 ，就大功告成啦!</li>
            <li id="li5" class="content">如果想吃有點重口味，可加入少許醬油或醋增加風味</li>
        </ol>
        <img src="./chicken soup.jpg" alt ="chicken soup" width="400">
</body>
</html>
